<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Page not found - KZN Web Studio</title>
<link rel="icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;800;900&family=Space+Mono&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Archivo',sans-serif;background:#0a0a0a;color:#f5f0e8;display:flex;flex-direction:column;min-height:100vh}
.wrap{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem}

.footer{padding:1.5rem;text-align:center;color:rgba(245,240,232,.2);font-size:.8rem;border-top:1px solid rgba(245,240,232,.06)}

    <div class="code">404</div>
